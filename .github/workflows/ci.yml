name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the audit sees every commit message.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Audit history and tree
        run: uv run python scripts/audit.py

  analysis:
    runs-on: ubuntu-latest
    # R 4.4.0 (the version in analysis/renv.lock) comes preinstalled, so no
    # system packages are installed on each run.
    container: rocker/r-ver:4.4.0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv sync --locked
      # Prebuilt Linux binaries from Posit Package Manager for the container's
      # Ubuntu release, instead of building CRAN sources.
      - name: Use binary R packages
        run: |
          . /etc/os-release
          echo "RENV_CONFIG_REPOS_OVERRIDE=https://packagemanager.posit.co/cran/__linux__/$VERSION_CODENAME/latest" >> "$GITHUB_ENV"
      # Restores the package library from the cache keyed by renv.lock, and
      # saves it after a cache miss.
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: analysis
      - name: Synthetic outputs
        run: echo "SYNTHETIC_RUNS=$RUNNER_TEMP/synthetic_runs" >> "$GITHUB_ENV"
      - run: uv run python -m eval.synthetic --out "$SYNTHETIC_RUNS"
      - name: R tests
        run: Rscript analysis/tests/testthat.R
      # CI uses 1,000 resamples; the reported analysis uses the planned 10,000.
      # The cross-check compares point estimates, which do not depend on them.
      - name: Analysis and cross-check, synthetic outputs
        run: |
          Rscript analysis/run_analysis.R --runs "$SYNTHETIC_RUNS" --out "$RUNNER_TEMP/synthetic_report" --resamples 1000
          uv run python -m eval.crosscheck --runs "$SYNTHETIC_RUNS" --tables "$RUNNER_TEMP/synthetic_report/analysis"
      - name: Analysis and cross-check, committed outputs
        run: |
          Rscript analysis/run_analysis.R --out "$RUNNER_TEMP/report" --resamples 1000
          uv run python -m eval.crosscheck --tables "$RUNNER_TEMP/report/analysis"

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: |
          npm run lint
          npm run typecheck
      - name: Build
        run: |
          npm run data
          npm run build
      - name: Check the build contains no images
        run: npm run check-dist
