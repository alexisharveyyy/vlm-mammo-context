[project]
name = "vlm-mammo-context"
version = "0.0.0"
description = "Do vision-language models change their mammogram reading when only the prompt changes?"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alexis Harvey" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Exact pins: PNG bytes depend on Pillow and its zlib, pixels on pydicom
    # and numpy, manifest bytes on pandas, and the splits on the IDC index
    # shipped in idc-index-data.
    "idc-index==0.13.4",
    "idc-index-data==25.0.5",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pillow==13.0.0",
    "pydicom==3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
