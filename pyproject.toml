[project]
name = "vlm-mammo-context"
version = "0.0.0"
description = "Do vision-language models change their mammogram reading when only the prompt changes?"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alexis Harvey" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
